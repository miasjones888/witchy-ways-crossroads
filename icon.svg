<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <!-- Background — deep stone with vignette -->
  <rect width="512" height="512" fill="#1F232A"/>
  <rect x="32" y="32" width="448" height="448" fill="#2A2F38"/>

  <!-- Pixel grid setup: 32x32 pixel canvas, each pixel = 16 actual px -->
  <!-- Background atmospheric gradient layer -->
  <rect x="48" y="48" width="416" height="416" fill="#1F232A" opacity="0.4"/>

  <!-- ============================================ -->
  <!-- BLACK CAT — left side, pixel art -->
  <!-- ============================================ -->
  <!-- Cat body (rounded) -->
  <g fill="#0A0C10">
    <!-- Cat head pixels -->
    <rect x="80" y="240" width="32" height="16"/>
    <rect x="64" y="256" width="96" height="16"/>
    <rect x="48" y="272" width="128" height="16"/>
    <rect x="48" y="288" width="128" height="16"/>
    <rect x="48" y="304" width="128" height="16"/>
    <rect x="48" y="320" width="128" height="16"/>

    <!-- Ears -->
    <rect x="48" y="224" width="32" height="32"/>
    <rect x="64" y="208" width="16" height="16"/>
    <rect x="144" y="224" width="32" height="32"/>
    <rect x="144" y="208" width="16" height="16"/>

    <!-- Body -->
    <rect x="64" y="320" width="128" height="16"/>
    <rect x="48" y="336" width="144" height="16"/>
    <rect x="48" y="352" width="144" height="16"/>
    <rect x="48" y="368" width="144" height="16"/>
    <rect x="64" y="384" width="128" height="16"/>

    <!-- Tail curling around -->
    <rect x="192" y="336" width="16" height="16"/>
    <rect x="208" y="320" width="16" height="32"/>
    <rect x="224" y="304" width="16" height="32"/>
    <rect x="240" y="288" width="16" height="32"/>
    <rect x="256" y="288" width="16" height="16"/>
    <rect x="272" y="288" width="16" height="16"/>
  </g>

  <!-- Cat eyes — gold/amber glow -->
  <rect x="80" y="288" width="16" height="16" fill="#A8895A"/>
  <rect x="128" y="288" width="16" height="16" fill="#A8895A"/>

  <!-- Cat eye pupils -->
  <rect x="88" y="288" width="8" height="16" fill="#0A0C10"/>
  <rect x="136" y="288" width="8" height="16" fill="#0A0C10"/>

  <!-- Cat nose — small triangle -->
  <rect x="104" y="304" width="16" height="8" fill="#3F2419"/>

  <!-- Cat whiskers -->
  <line x1="56" y1="312" x2="32" y2="308" stroke="#54585F" stroke-width="2"/>
  <line x1="56" y1="316" x2="32" y2="318" stroke="#54585F" stroke-width="2"/>
  <line x1="168" y1="312" x2="192" y2="308" stroke="#54585F" stroke-width="2"/>
  <line x1="168" y1="316" x2="192" y2="318" stroke="#54585F" stroke-width="2"/>

  <!-- ============================================ -->
  <!-- CANDLE — right side, pixel art -->
  <!-- ============================================ -->

  <!-- Candle holder/base — dark stone -->
  <rect x="320" y="384" width="80" height="16" fill="#3F2419"/>
  <rect x="304" y="400" width="112" height="16" fill="#2A1810"/>
  <rect x="288" y="416" width="144" height="16" fill="#1F1208"/>

  <!-- Candle body — beeswax -->
  <rect x="336" y="240" width="48" height="144" fill="#A8895A"/>
  <rect x="336" y="240" width="16" height="144" fill="#C4A06D"/>
  <rect x="368" y="240" width="16" height="144" fill="#8C6B3A"/>

  <!-- Candle wax dripping -->
  <rect x="336" y="384" width="8" height="16" fill="#8C6B3A"/>
  <rect x="376" y="384" width="8" height="16" fill="#8C6B3A"/>

  <!-- Wick -->
  <rect x="356" y="224" width="8" height="16" fill="#16191E"/>

  <!-- Flame — three layers of pixel-flame -->
  <!-- Outer flame (warm glow) -->
  <rect x="344" y="200" width="32" height="8" fill="#F5C36E" opacity="0.4"/>
  <rect x="336" y="184" width="48" height="16" fill="#F5C36E" opacity="0.5"/>
  <rect x="328" y="168" width="64" height="16" fill="#F5C36E" opacity="0.4"/>
  <rect x="336" y="152" width="48" height="16" fill="#F5C36E" opacity="0.3"/>
  <rect x="344" y="136" width="32" height="16" fill="#F5C36E" opacity="0.2"/>

  <!-- Mid flame (orange) -->
  <rect x="344" y="200" width="32" height="8" fill="#E89E4A"/>
  <rect x="344" y="184" width="32" height="16" fill="#E89E4A"/>
  <rect x="352" y="168" width="16" height="16" fill="#E89E4A"/>

  <!-- Inner flame (white-yellow core) -->
  <rect x="352" y="200" width="16" height="8" fill="#FFE8B8"/>
  <rect x="352" y="184" width="16" height="16" fill="#FFE8B8"/>

  <!-- Wick top (dark) -->
  <rect x="356" y="208" width="8" height="8" fill="#16191E"/>

  <!-- Halation ring around candle -->
  <circle cx="360" cy="280" r="100" fill="none" stroke="#A8895A" stroke-width="1" opacity="0.15"/>
  <circle cx="360" cy="280" r="140" fill="none" stroke="#A8895A" stroke-width="1" opacity="0.08"/>

  <!-- ============================================ -->
  <!-- DECORATIVE BORDER -->
  <!-- ============================================ -->
  <rect x="32" y="32" width="448" height="448" fill="none" stroke="#7A2818" stroke-width="2"/>
  <rect x="48" y="48" width="416" height="416" fill="none" stroke="#7A2818" stroke-width="1" opacity="0.4"/>

  <!-- Corner ornaments — small pixel diamonds -->
  <rect x="56" y="56" width="8" height="8" fill="#A8895A"/>
  <rect x="448" y="56" width="8" height="8" fill="#A8895A"/>
  <rect x="56" y="448" width="8" height="8" fill="#A8895A"/>
  <rect x="448" y="448" width="8" height="8" fill="#A8895A"/>
</svg>
